  /* ============================================================

  function getTimezoneOffsetHours(date, timeZone) {

    const parts =
      new Intl.DateTimeFormat(
        "en-US",
        {
          timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hourCycle: "h23"
        }
      ).formatToParts(date);

    const values = {};

    parts.forEach(part => {

      if (part.type !== "literal") {
        values[part.type] = Number(part.value);
      }

    });

    const localAsUTC =
      Date.UTC(
        values.year,
        values.month - 1,
        values.day,
        values.hour,
        values.minute,
        values.second
      );

    const actualUTC =
      Date.UTC(
        date.getUTCFullYear(),
        date.getUTCMonth(),
        date.getUTCDate(),
        date.getUTCHours(),
        date.getUTCMinutes(),
        date.getUTCSeconds()
      );

    return Math.round(
      (localAsUTC - actualUTC) / 3600000
    );

  }


  /* ============================================================
     FORMAT OFFSET
     ============================================================ */

  function formatDifference(hours) {

    if (hours === 0) {
      return "Same";
    }

    return hours > 0
      ? `+${hours}h`
      : `${hours}h`;

  }


  /* ============================================================
     UPDATE CLOCKS
     ============================================================ */

  function updateClocks() {

    const now = new Date();

    /* ---------------- Tbilisi ---------------- */

    const tbilisiOptions = {

      timeZone: "Asia/Tbilisi",

      hour: "2-digit",
      minute: "2-digit",

      ...(showSeconds
        ? { second: "2-digit" }
        : {}),

      hour12: false

    };

    document.getElementById("clock-georgia").textContent =
      new Intl.DateTimeFormat(
        "en-GB",
        tbilisiOptions
      ).format(now);


    document.getElementById("date-georgia").textContent =
      new Intl.DateTimeFormat(
        "en-US",
        {
          timeZone: "Asia/Tbilisi",
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        }
      ).format(now);


    /* ---------------- US STATES ---------------- */

    const tbilisiOffset =
      getTimezoneOffsetHours(
        now,
        "Asia/Tbilisi"
      );


    STATES.forEach(state => {

      const timeElement =
        document.getElementById(
          `clock-${state.state}`
        );

      const dateElement =
        document.getElementById(
          `date-${state.state}`
        );

      const offsetElement =
        document.getElementById(
          `offset-${state.state}`
        );

      const codeElement =
        document.getElementById(
          `code-${state.state}`
        );


      if (!timeElement) return;


      /* TIME */

      const timeOptions = {

        timeZone: state.zone,

        hour: "2-digit",
        minute: "2-digit",

        ...(showSeconds
          ? { second: "2-digit" }
          : {}),

        hour12: false

      };

      timeElement.textContent =
        new Intl.DateTimeFormat(
          "en-GB",
          timeOptions
        ).format(now);


      /* DATE */

      dateElement.textContent =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: state.zone,
            weekday: "short",
            month: "short",
            day: "numeric"
          }
        ).format(now);


      /* OFFSET */

      const stateOffset =
        getTimezoneOffsetHours(
          now,
          state.zone
        );

      const difference =
        stateOffset - tbilisiOffset;

      offsetElement.textContent =
        formatDifference(difference);


      /* TIMEZONE CODE */

      const codeFormatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: state.zone,
            timeZoneName: "short"
          }
        );

      const parts =
        codeFormatter.formatToParts(now);

      const zonePart =
        parts.find(
          p => p.type === "timeZoneName"
        );

      if (zonePart) {
        codeElement.textContent =
          zonePart.value;
      }

    });

  }


  /* ============================================================
     SEARCH
     ============================================================ */

  function setupSearch() {

    const input =
      document.getElementById("searchInput");

    input.addEventListener(
      "input",
      function () {

        const query =
          this.value
            .trim()
            .toLowerCase();

        document
          .querySelectorAll(".state-card")
          .forEach(card => {

            const state =
              card.dataset.state.toLowerCase();

            const name =
              card.dataset.name;

            const match =
              !query ||
              state.includes(query) ||
              name.includes(query);

            card.classList.toggle(
              "hidden-card",
              !match
            );

          });


        /* Hide empty sections */

        document
          .querySelectorAll(".timezone-section")
          .forEach(section => {

            const visibleCards =
              section.querySelectorAll(
                ".state-card:not(.hidden-card)"
              );

            section.style.display =
              visibleCards.length
                ? ""
                : "none";

          });

      }
    );

  }


  /* ============================================================
     THEME
     ============================================================ */

  function setupTheme() {

    const button =
      document.getElementById(
        "themeToggleBtn"
      );

    const label =
      document.getElementById(
        "themeLabel"
      );


    button.addEventListener(
      "click",
      () => {

        const isDark =
          document.documentElement
            .classList
            .toggle("dark");

        label.textContent =
          isDark
            ? "Dark Theme"
            : "Light Theme";

      }
    );

  }


  /* ============================================================
     SECONDS
     ============================================================ */

  function setupSeconds() {

    const checkbox =
      document.getElementById(
        "toggleSeconds"
      );

    checkbox.addEventListener(
      "change",
      event => {

        showSeconds =
          event.target.checked;

        updateClocks();

      }
    );

  }


  /* ============================================================
     INITIALIZATION
     ============================================================ */

  window.addEventListener(
    "load",
    () => {

      buildDashboard();

      setupSearch();

      setupTheme();

      setupSeconds();

      updateClocks();

      setInterval(
        updateClocks,
        1000
      );

    }
  );

</script>

</body>
</html>
